plugins {
    id 'com.android.application'
}

android {
    namespace 'id.tabungansaya.app'
    compileSdk 34

    defaultConfig {
        applicationId 'id.tabungansaya.app'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '1.0.0'
    }

    signingConfigs {
        release {
            def ksPath = System.getenv('KEYSTORE_PATH') ?: "${projectDir}/release.jks"
            storeFile file(ksPath)
            storePassword System.getenv('STORE_PASSWORD') ?: 'tabungansaya123'
            keyAlias System.getenv('KEY_ALIAS') ?: 'tabungansaya'
            keyPassword System.getenv('KEY_PASSWORD') ?: 'tabungansaya123'
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
        debug {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
