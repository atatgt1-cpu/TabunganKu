name: Build Signed Release APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 34 components & write local.properties
        run: |
          SDK_DIR="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          SDKMANAGER=$(command -v sdkmanager || find "$SDK_DIR/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -n 1)
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"
          echo "sdk.dir=$SDK_DIR" > android/local.properties

      - name: Prepare Release Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > android/app/release.jks
          else
            keytool -genkeypair -v \
              -keystore android/app/release.jks \
              -alias "${KEY_ALIAS:-tabungansaya}" \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "${STORE_PASSWORD:-tabungansaya123}" \
              -keypass "${KEY_PASSWORD:-tabungansaya123}" \
              -dname "CN=TabunganSaya, OU=Mobile, O=TabunganSaya, L=Jakarta, S=DKI, C=ID"
          fi

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Release APK
        working-directory: android
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/android/app/release.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD || 'tabungansaya123' }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'tabungansaya' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'tabungansaya123' }}
        run: gradle assembleRelease --no-daemon

      - name: Upload Signed APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TabunganSaya-release-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
